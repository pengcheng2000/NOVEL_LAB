relationship_engine:
  ryle_x_lily:
    attraction_mechanism: "symmetric deep self-disclosure (sanctioned confession game, Ch1)"
    hook: "relationship starts at high watermark; every step tests whether it survives reality"
    evidence: TEXTUAL(Ch1) for mechanism / SECONDARY for trajectory
  atlas_x_lily:
    attraction_mechanism: "unfinished first love + rescue debt"
    function: "his existence refutes Ryle's narrative legitimacy"
    confidence: MEDIUM
  triangulation: "Ryle(present love) / Atlas(past love) / father(wrong love template) — every choice scored in all three frames"

conflict_engine:
  obstacle_generation: "endogenous — danger is embedded in the love object; conflict scales with intimacy, not with external enemies"
  story_renewal_engine: "each cycle adds a new exit-cost (business entanglement, marriage, pregnancy) so leaving gets harder as feeling gets deeper"
  confidence: MEDIUM

groundedness:
  ch1_anchors: [startup capital pressure, med-school vs arts class gap, Boston apartment, funeral bills]
  function: "realism removes the reader's escape hatch of 'it's just an exaggerated genre world' — abuse hits at full force"
  score_note: "high for opening (textual); full-book score deferred"
  confidence: HIGH

distinctive_mechanisms:
  - name: Threat-to-Characterization Open
    evidence_scope: Chapter 1
    confidence: HIGH
  - name: Sanctioned Confession Ladder
    evidence_scope: Chapter 1
    confidence: HIGH
  - name: Peak Interruption
    evidence_scope: Chapter 1
    confidence: HIGH
  - name: Double-Negation Hook
    evidence_scope: Chapter 1
    confidence: HIGH
  - name: Reward-Trap Inversion
    principle: "turn the genre's biggest reward moment into its biggest cost moment; genre reflex is the misdirection tool"
    confidence: MEDIUM
  - name: Generational Mirror Engine
    principle: "the path the protagonist despises most becomes her future mirror; louder the early condemnation, stronger the payoff"
    confidence: MEDIUM
  - name: Partially-Valid Rationalization
    principle: "the best cover for harm is not a lie but nine parts truth to one part falsehood"
    confidence: MEDIUM
  - name: Interrupted-Inheritance Closure
    principle: "proving the cycle is broken should DELAY the new reward, not immediately grant it"
    confidence: LOW

originality_tiers:
  green: [all transferable principles above, reward inversion, generational mirror]
  yellow: ["survivor-daughter x neurosurgeon x first-love triangle occupational config", "naked truths phrasing", "anti-eulogy scene shape"]
  red: [character names (Lily Bloom/Ryle Kincaid/Atlas Corrigan), "'It ends with us' generational hand-down phrasing", "flower shop + surname Bloom double meaning", specific abuse-event chain]

video_adaptation:
  ai_video_value: 7
  rationale: "low VFX, dialogue-driven two-handers, real locations = AI-generation friendly; risk is long-range emotional continuity"
