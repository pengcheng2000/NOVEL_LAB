basic_info:
  title: It Ends with Us
  author: Colleen Hoover
  original_language: English
  genre: Contemporary Romance / Women's Fiction
  publication_period: 2016 (Atria); TikTok resurgence 2021
  popularity_context: "TikTok #BookTok phenomenon; one of the best-selling novels of the 2020s"
  adaptation_status: "Film 2024 (Blake Lively)"

one_line_core:
  premise: "Florist Lily falls for a perfect neurosurgeon who gradually reenacts the abusive marriage she swore never to repeat."
  core_fantasy: "Not being loved by a perfect man — having the strength to leave one."
  central_question: "Will Lily recognize the repetition before she becomes her mother?"  # confidence: MEDIUM (secondary)
  reader_promise: "Fall in love, see clearly, break the cycle — catharsis, not suspense."
  confidence: MEDIUM

protagonist_system:
  starting_status: "23, new grad, opening a flower shop in Boston, father just buried, mother a domestic-abuse survivor"
  desire: "To be loved AND to build a life unlike her parents'"
  fear: "Becoming her mother"
  weakness: "High tolerance for love-as-harm explanations (childhood-trained)"
  contradiction: "Despises her mother for staying while walking into her own staying"
  special_advantage: "Trauma-honed honesty and ability to see through masks (Ch1 textual)"
  relatability: "Self-made, under-capitalized, family-trauma background for core female readership"
  wish_fulfillment: "Dual: elite-male devotion (surface) / final sovereignty over one's own life (deep)"
  character_arc: deferred_full_source
  evidence: TEXTUAL(Ch1)+SECONDARY

reader_addiction_loop:
  primary_loop:
    name: "Fall-and-Crack Loop"
    shape: "love token -> red flag -> partially-valid rationalization -> deeper token -> bigger flag"
    why_repeatable: "flags escalate as intimacy deepens; each rationalization is harder to sustain"
    confidence: MEDIUM
  secondary_loop:
    name: "Atlas past-timeline counterpoint"
    shape: "present happiness interleaved with past rescue/first love"
    confidence: MEDIUM
  long_term_loop:
    name: "Generational mirror (mother as preview of Lily's choices)"
    confidence: MEDIUM

reward_engine:
  primary_rewards: [romance, emotional_payoff]
  secondary_rewards: [competence_flantasy_note_flowershop_business_progression]
  signature_inversion: "Reward-Trap Inversion: each genre milestone (commitment/engagement) doubles as strongest danger evidence"
  reward_frequency: deferred_full_source
