groundedness:
  strategy: "fantasy anchored in school-day reality: gym anxiety, gear checklists, mother's favoritism, freshman social dynamics"
  reality_mirror: "daughter whose life is arranged by mother; woman competing with different resources in male-designed system; the marked kid punished for parents' treason"
  confidence: HIGH

distinctive_mechanisms:
  - {name: Physical-Constant Handicap, principle: "make the weakness a non-depreciating physical constant; every scene auto-accrues risk", confidence: HIGH}
  - {name: Institutional Death Schedule, principle: "outsource conflict generation to an institution's public calendar — no one to blame, nowhere to flee", confidence: HIGH}
  - {name: Peer-Incentivized Lethality, principle: "zero-sum rules let allies and enemies interchange; relationships carry flip potential", confidence: HIGH}
  - {name: Inherited-Feud Attraction, principle: "inherited hate gives zero-cost initial tension; love's progress overthrows the parents' narrative", confidence: HIGH}
  - {name: Countdown First Line, principle: "quantified danger + deadline + abnormal calm in sentence one", confidence: HIGH}
  - {name: Kill-the-Sympathetic, principle: "death threat credibility comes from killing the likable, not the many", confidence: HIGH}
  - {name: Equipment-as-Love, principle: "materialize affection as functional gear — one prop charges relationship, world, and foreshadowing", confidence: HIGH}
  - {name: Signal-Contradiction Antagonist, principle: "word/action gap instead of twist — the prediction process is the reward", confidence: MEDIUM}

originality_tiers:
  green: [all principles above]
  yellow: ["frail-rider x dragon academy x two-dragon-bond genre config", "Xaden visual archetype stack (black hair + onyx gold-flecked eyes + rebellion relic + wingleader)"]
  red: [Basgiath/Navarre/Poromiel/Tairn/Andarna/Xaden Riorson names, Codex article texts, two-dragon bond as specific setting, Brennan-alive reveal chain]

