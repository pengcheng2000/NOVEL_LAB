one_line_core:
  premise: "A frail scribe's daughter is forced by her general mother into a war college where half the candidates die, and must outsmart death daily under the eyes of the wingleader who has every reason to let her die."
  core_fantasy: "The weakest proves strongest + being watched by the most dangerous man"
  central_question: "Will Violet survive Basgiath — and what is the institution hiding?"
  reader_promise: "One death-defying trial per arc, one attraction escalation per Xaden scene"

protagonist_system:
  starting_status: "20, chronically frail body, scribe-trained, father dead, brother dead in rebellion, mother = commanding general who consigned her to the Riders Quadrant"
  desire: "To be a scribe (denied desire — superior to 'wants to be strong')"
  fear: "Dying weak in her mother's eyes; Mira losing her last sibling"
  weakness: "Body as physical constant — every action scene carries default risk"
  special_advantage: "Intellect + scribe knowledge base (banned folklore, history, Codex) = information advantage"
  information_advantage: "Scribe training: she knows what riders don't read"
  social_position: "Commander's daughter (hatred magnet) x 'weakest candidate' (public mockery) — double magnetic field"
  wish_fulfillment: "The underestimated woman winning in a male-designed institution using different resources"
  contradiction: "Loves her father's world of books (incl. banned knowledge) but must survive the institution that destroyed him"

reader_addiction_loop:
  primary_loop:
    name: "Death-Trial Loop"
    shape: "scheduled lethal trial -> short prep (gear/knowledge/alliance) -> execution exposing weakness -> intellect break -> survival + status/relationship shift -> bigger trial"
    why_repeatable: "institution generates trials on a public schedule; each survival upgrades resources and enemies"
    confidence: HIGH
  secondary_loop:
    name: "Xaden signal-decode loop (hate-speech vs protective-action gap)"
    confidence: MEDIUM
  long_term_loop:
    name: "Institutional lie (venin truth / border truth / brother's death)"
    confidence: MEDIUM

