one_line_core:
  premise: "In early-Republican China, a northern landowner's son carries the baby girl his runaway wife left behind, searching for a place called 'Wencheng' — a place she invented, which he comes to believe is the town he settles and dies in."
  core_fantasy: "Searching for someone who left you — love as a lifetime unilateral obligation"
  central_question: "Will he ever understand why Xiaomei left? (Answer withheld to the supplement)"  # confidence: MEDIUM
  reader_promise: "dull ache — goodness fully honored yet fate-unrewarded"

protagonist_system:
  starting_status: "wealthy northern farm heir; honest, taciturn, master carpenter — the honest-man build whose only weakness is trust"
  desire: "find Xiaomei; give her (and himself) a whole family"
  special_advantage: "craft and credit — the 'dumb capital' he lives on in Xizhen"
  contradiction: "keeping a promise built on a lie for a lifetime — the deceived man's faithfulness"
  wish_fulfillment: "carrying the blame of being deceived oneself; Chinese-style silent fatherhood"

reader_addiction_loop:
  primary_loop:
    name: "Mistaken-Anchorage Loop"
    shape: "clue points to Xiaomei maybe-here -> he puts down roots waiting (each clue missing the last link) -> life accumulates (deeper roots, higher exit cost) -> era violence interrupts"
    why_repeatable: "tension = widening gap between shrinking physical search radius and growing emotional radius"
    confidence: MEDIUM
  long_term_loop:
    name: "Xiaomei's truth deferred to the 'supplement' — the reader learns the lie's internal structure last"
    confidence: MEDIUM

reward_engine:
  primary_rewards: [emotional_payoff_friendship_fatherhood, mystery_payoff_in_supplement]
  character: "anti-爽文 — satisfaction fully deferred to post-hoc re-valuation of events"
