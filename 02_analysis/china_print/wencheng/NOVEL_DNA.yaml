relationship_engine:
  lin_xiangfu_x_xiaomei: "asymmetric devotion; the deceiver is herself trapped (husband/family/era) — the swindler as tragic figure"
  lin_xiangfu_x_chen_yongliang: "modern myth of male loyalty — the waiting line's main engine"
  promise_displacement: "the promise object slides from the woman to the daughter she left — the book's most moving redirect"

conflict_engine:
  obstacle_generation: "era violence (banditry, war, snowstorm) + the waiting paradox (confirming Xizhen is Wencheng would prove she'll never come)"
  story_renewal_engine: "rotation of natural disasters, bandit raids, and ensemble-line switching"
  confidence: MEDIUM

groundedness:
  strategy: "Republican-era Jiangnan material inventories — fate's full weight placed on daily-object lists (same Object-List Realism as LiC, serving tragedy not comedy)"
  confidence: MEDIUM

distinctive_mechanisms:
  - {name: Fictive-Destination Quest, principle: "materialize the obsession's target from a person into a place — places cannot refuse, lie, or leave again; the quest gains legitimacy and epic scale", confidence: MEDIUM}
  - {name: Reader-Knows-Place Gap, principle: "let the reader know earlier that the destination doesn't exist — every effort converts into poignancy instead of hope (information gap run in reverse)", confidence: MEDIUM}
  - {name: Displaced Promise, principle: "when the promise's target vanishes, slide it onto the relic/orphan — the obsession gets a second life", confidence: MEDIUM}
  - {name: Supplement-Side Reveal, principle: "after the ending, replay the whole book from the deceiver's POV — truth reorders meaning without changing facts; one narrative = two consumptions", confidence: MEDIUM}
  - {name: Kindness-under-Fate, principle: "all goodness honored as goodness, none of it changing fate — moral return fully decoupled from fate's return", confidence: MEDIUM}

