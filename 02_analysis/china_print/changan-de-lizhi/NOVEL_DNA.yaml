one_line_core:
  premise: "In Tang-dynasty Chang'an, an honest math-trained minor official is tricked into a death-sentence errand: deliver fresh lychees (they spoil in three days) 5,000 li from Lingnan to the capital before the Consort's birthday — and he decides to compute whether it can be done."
  core_fantasy: "A little man defeating the entire bureaucratic machine with professional competence and his life on the line"
  central_question: "Can it be done technically — and what kind of man will doing it make him?"
  reader_promise: "engineering breakthrough per arc + a bitter undertone: every success adds moral debt"

protagonist_system:
  starting_status: "bottom-tier technical official, just mortgaged a house in the capital, wife and daughter — the middle-aged mortgage holder"
  desire: "survive; keep family unharmed (exile counts as living)"
  fear: "not death but joint liability — all his fears are family-sized"
  weakness: "cannot do office politics — honesty is both social defect and technical virtue (male version of Unappealing Heroine Paradox)"
  special_advantage: "mathematics + experimental methodology — the only engineer in a political world"
  contradiction: "completing the task requires the very machine that crushes ordinary people — success and conscience are zero-sum"
  relatability: "the scapegoated middle manager, the impossible KPI, the 'I just want to do the work right' technician"

reader_addiction_loop:
  primary_loop:
    name: "Engineering-Trial Loop"
    shape: "deadline countdown -> technical obstacle -> verifiable experiment/calculation -> partial breakthrough -> new systemic obstacle -> tighter deadline"
    why_repeatable: "task decomposed into enumerable engineering links (preservation x route x relay x ice) — episodic unit-drama of engineering"
    confidence: MEDIUM-HIGH
  secondary_loop:
    name: "Bureaucratic bargaining loop — each technical gain needs political resources, each resource costs morality or loyalty, politics bites back"
    confidence: MEDIUM
  long_term_loop:
    name: "the accumulating cost ledger — final moral reckoning about what kind of man he becomes"
    confidence: MEDIUM

