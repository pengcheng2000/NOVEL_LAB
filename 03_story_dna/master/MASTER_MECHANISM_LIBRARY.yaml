    appears_in: [CYS, DCS, FH, WC, RSH, LiC(60s 美国)]
    underlying_psychology: "读者的'我经历过/我听说'是终极锚点——年代物件/价格/歌曲/新闻的真实性直接兑换怀旧与信任; 重生文把读者的青春变成作品的免费世界观资产"
    minimum_components: [年代细节的真实核验级精确(价格/物件/事件), 细节与情节的功能绑定(非布景)]
    optional_components: [读者的代际差设计(父辈+子辈双入口)]
    failure_modes: ["细节穿帮→考古变出戏", "怀旧无情节功能→明信片化"]
    transformations:
      都市: 近十年城市变迁
      悬疑: 冷案的年代证据学
      爱情: 校园年代恋
      玄幻: 设定界的'旧纪元'考古
      科幻: 近未来怀旧(2000s 电子味)
      职场: 行业编年
      校园: 高考年代志(最原位)
    originality_risk: LOW
    video_potential: 7

  # ============ G. 能力系统类 ============

  - id: MM33
    mechanism: Internalized Cheat Code (金手指内化)
    appears_in: [CYS(记忆), DF(思维方式), ZS(神话联结), SRI(智力), DCS(记忆)]
    underlying_psychology: "2020s 头部共识: 金手指必须在人物内部(可被尊重的能力)而非外部系统发放(廉价)——能力自带正当性; 内化到极致即消失(纯智力=无金手指)"
    minimum_components: [能力的人物内来源(记忆/思维/联结), 能力的边界或代价]
    optional_components: [能力的成长性(思维方式的迭代), 能力与人格的绑定(能力即人)]
    failure_modes: ["无边界内化能力→爽点通胀", "能力与人格脱钩→换人也成立"]
    transformations:
      都市: 预知/心理侧写
      悬疑: 微表情识别
      爱情: 读心(限定条件)
      玄幻: 特殊体质(传统位)
      科幻: 脑机接口专长
      职场: 跨界方法论
      校园: 超强记忆(限定遗忘代价)
    originality_risk: LOW
    video_potential: 5

  - id: MM34
    mechanism: Public-Domain Database Renewal (公版数据库续航)
    appears_in: [ZS(神话), DF(历史/志怪), RSH(民间传说质感), EGN(民族志素材)]
    underlying_psychology: "神话/历史/公版文本=免费无限且读者自带前理解的内容数据库——每个新角色/敌人/谜题都有零学习成本的大众认知背书; '揭晓是哪位神'本身即奖励"
    minimum_components: [一个大众熟悉的公版体系(神话/历史/传说), 体系内角色的渐进揭示排期]
    optional_components: [体系的冷门深度(大众认知内做深挖惊喜), 体系间的混搭(东西神话对撞)]
    failure_modes: ["公版角色的原创化不足→同人感", "只点名不出新解(数据库无加工)"]
    transformations:
      都市: 城市传说数据库
      悬疑: 历史悬案重查
      爱情: 文学爱情原型重现
      玄幻: 修真/封神体系(最原位)
      科幻: 科学史名人 AI 化
      职场: 商业史案例重演
      校园: 学科史人物
    originality_risk: LOW  # 体系本身公版; 但'斩神/精神病院'组合配置 MEDIUM
    video_potential: 8

  - id: MM35
    mechanism: Modern-Mind Transfer (现代思维降维喜剧)
    appears_in: [DF(现代思维×古代), LiC(科学思维×家庭主妇时代), CAL(项目管理×唐代)]
    underlying_psychology: "把读者自己的思维方式装进不兼容的世界——爽点与笑点共用同一装置; 主角的'常识'在异世界成为超能力, 读者的日常认知被反常化尊重"
    minimum_components: [思维方式的详细刻画(可复述的方法论), 不兼容的世界, 思维方式的初次降维兑现]
    optional_components: [思维方式的局限暴露(现代性并非万能→防爽点通胀)]
    failure_modes: ["思维方式只有名词无方法→降维无实感", "异世界为配合而降智"]
    transformations:
      都市: 跨行思维降维(程序员×餐饮)
      悬疑: 法医思维×民间破案
      爱情: 理性思维×感性关系
      玄幻: 现代人×修真界(最原位)
      科幻: 人文思维×AI 社会
      职场: 跨界空降者
      校园: 社会经验×校园规则
    originality_risk: LOW
    video_potential: 8

  # ============ H. 信息与悬念类 ============

  - id: MM36
    mechanism: Rule-as-Text Weaponization (规则文本武器化)
    appears_in: [SRI(游戏规则字缝藏杀机), CAL(公文'荔枝煎'变'鲜'字陷阱)]
    underlying_psychology: "把杀机/转机藏在规则文本的字缝里——'重读规则'即入坑时刻, 阅读行为本身被戏剧化; 读者回头翻公文/规则的动作=二次消费+参与感"
    minimum_components: [一份完整公布的规则/公文文本, 文本内的可被重新解读的关键字缝, 重新解读的扳机事件]
    optional_components: [规则的多层字缝(初读/二读/三读各有机), 规则制定者的意图伏笔]
    failure_modes: ["字缝过于隐晦(无人发现→无兑付)", "字缝过于明显(无侦探快感)"]
    transformations:
      都市: 合同/条款陷阱
      悬疑: 遗嘱/法律条文(最原位)
      爱情: 婚前协议的字缝
      玄幻: 天道规则的漏洞(修真者的'律师'玩法)
      科幻: 机器人三定律的漏洞
      职场: 员工手册/规章的字缝
      校园: 校规的字缝博弈
    originality_risk: LOW
    video_potential: 9

  - id: MM37
    mechanism: Cross-Space Anonymous Social Layer (跨空间匿名社交层)
    appears_in: [DF(地书)]  # 15 本中唯一的主角间社交系统发明
    underlying_psychology: "匿名身份谜题+信息差交易市场合于一装置——社交本身成为游戏: 每个新成员入场自带'TA是谁'的悬念, 每条信息都有交易价值; 唯一被验证的'关系性产品化'样本"
    minimum_components: [一个跨空间的通讯装置, 匿名规则(身份不可见), 信息的交易机制(为什么说话)]
    optional_components: [成员身份的逐个揭晓排期(集卡性), 匿名与现实线的行为对照(双秘密螺旋变体)]
    failure_modes: ["匿名无代价→无人珍惜", "社交层与主线无交易关系→装饰性"]
    transformations:
      都市: 匿名群聊/树洞
      悬疑: 匿名线人网络
      爱情: 陌生人笔友(老而有效)
      玄幻: 法器传讯(最原位)
      科幻: 量子纠缠通讯/跨星际延迟信箱
      职场: 匿名职场社区(内幕交易)
      校园: 匿名校园墙
    originality_risk: MEDIUM  # '地书'具体形式已绑 DF; 装置原理可迁移, 命名与媒介需全新设计
    video_potential: 9

  - id: MM38
    mechanism: Rumor-Approximation Narration (传闻逼近叙事)
    appears_in: [RSH(多版本传闻拼图), FH(饭局八卦), WC(文城传说)]
    underlying_psychology: "真相被切成互相矛盾的传闻版本逐版逼近——读者当拼图侦探, 每个新版本强制重估前文; 真相的最终形态=全书最大兑付之一"
    minimum_components: [核心秘密, ≥3 个互相矛盾的传闻版本, 版本间的信息增量(每版都有新碎片)]
    optional_components: [传闻讲述者各自的立场偏见(版本即人物), 最终真相的反传闻性(最不可能的版本为真)]
    failure_modes: ["版本无信息增量→重复", "真相弱于传闻积累→兑付泄气"]
    transformations:
      都市: 网络谣言的罗生门
      悬疑: 证人证言互斥(最原位)
      爱情: 分手原因的各方版本
      玄幻: 上古之战的多族传说
      科幻: 失事事件的档案罗生门
      职场: 离职传闻链
      校园: 转学生身世的流言版本
    originality_risk: LOW
    video_potential: 8

  - id: MM39
    mechanism: Body-Embedded Secret (身体嵌入型秘密)
    appears_in: [RSH(纹身/身体秘密), EGN(身体与自然的印记), CAL(身上的荔枝印记式代价)]
    underlying_psychology: "秘密长在身上——不可丢弃、不可言说、随时可能被看见; 身体同时是证据与刑具, 暴露风险随每一次亲密物理接触指数上升"
    minimum_components: [身体上的可被看见的秘密标记, 标记的不可移除性, 至少一次'差点被看见'的擦边事件]
    optional_components: [标记的双义性(耻辱×勋章的转变)]
    failure_modes: ["标记可轻松遮蔽→无风险", "暴露后无后果→威胁空转"]
    transformations:
      都市: 病历/残疾/身份纹身
      悬疑: 凶手留下的身体印记
      爱情: 伤疤的来历
      玄幻: 妖纹/魔印(最原位)
      科幻: 基因标记/编码纹
      职场: 工伤痕迹
      校园: 胎记/伤疤的霸凌线
    originality_risk: LOW  # RSH 的具体纹身设定 HIGH
    video_potential: 7

  - id: MM40
    mechanism: Kill-the-Sympathetic (牺牲可爱者立威胁)
    appears_in: [FW(同情者的死亡), EGN(亲近者的守恒律死亡), SRI(游戏死亡), HM(宠物线)]
    underlying_psychology: "杀死一个被充分可爱的角色=最便宜的威胁性兑付——读者在那一页学会'这个世界玩真的'; 但每个作者只有少数几次信用额度, 滥用即破产"
    minimum_components: [可爱度投资(≥3 个可爱化场景), 死亡的无预警性, 死后世界的持续痕迹(物件/影响)]
    optional_components: [死亡本可避免的选择性(加重道德债务)]
    failure_modes: ["可爱度投资不足→死亡无感", "滥用→读者情感脱敏/弃书"]
    transformations:
      都市: 恩人/宠物的死亡
      悬疑: 第二个受害者是读者喜欢的
      爱情: 阻碍者以死亡退场(悲剧爱情)
      玄幻: 师父之死(最原位)
      科幻: 队友的牺牲
      职场: 被裁的良师
      校园: 同桌的转学/病故
    originality_risk: LOW
    video_potential: 7

