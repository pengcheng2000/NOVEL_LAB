# MASTER_MECHANISM_LIBRARY.yaml — 15 本跨书主机制库
# 生成: 2026-09-13 (Phase 3, MASTER)
# 依据: 15 份 STORY_DNA_REPORT + 三组 SYNTHESIS/MECHANISMS
# ⚠️ 永久证据警告: 15 本中 FULL_SOURCE 0 本 (PARTIAL 4 / METADATA 1 / MISSING 10)。
#    本库全部结论为证据有界结论——开篇级机制可信度较高 (TEXTUAL), 全书/细节级 MEDIUM-LOW。
#    高风险原创决策前必须以原著复核。后四层证据 (SECONDARY/COMMUNITY/INFERENCE) 均不等于"原著中就是这样"。
# 缩写: IEWU=It Ends with Us, FW=Fourth Wing, LiC=Lessons in Chemistry, TML=The Midnight Library,
#       HM=The Housemaid, RSH=人生海海, WC=文城, CAL=长安的荔枝, EGN=额尔古纳河右岸, FH=繁花,
#       CYS=我真没想重生啊, DF=大奉打更人, ZS=斩神, SRI=十日终焉, DCS=都重生了谁谈恋爱啊
# 风险级: LOW=原理级可自由用 / MEDIUM=需变形 / HIGH=已与具体 IP 绑定, 只可用原理

meta:
  strongest_cross_book_finding: "Object-List Realism (物件清单现实主义) — 13/15 命中, 跨三个市场/十个品类, 本项目最可靠发现"
  second_strongest: "Checklist-as-Structure (清单即结构) — 遗憾/风口/证人/神话/规则清单横跨三组"
  evidence_layers: [TEXTUAL, PRIMARY_CONTEXT, RELIABLE_SECONDARY, COMMUNITY_INTERPRETATION, MODEL_INFERENCE]

mechanisms:

  # ============ A. 开局与承诺类 ============

  - id: MM01
    mechanism: Structural-Underdog Opening + Hidden Trump Card (结构性弱势开局 + 底牌预告)
    appears_in: [IEWU, FW, LiC, TML, HM, RSH, WC, CAL, EGN, FH, CYS, SRI]  # 12/15 显性
    underlying_psychology: "读者对结构性低位者(非暂时落难)代入最深; 开篇即预告的底牌制造最长线的期待——弱位供代入, 底牌供翻页"
    minimum_components: [身份/制度性低位开局(非事故性), 文案或开篇内预告一张底牌, 底牌兑现被结构性延迟]
    optional_components: [底牌的层级拆分(分批兑付), 底牌与弱位的因果关联(弱因牌起)]
    failure_modes: ["底牌兑现过早→后程无力", "弱位是暂时事故而非结构→代入浅", "底牌与主角人格脱钩→兑付无情感重量"]
    transformations:
      都市: 被城市制度排除的外来者持独家技能
      悬疑: 被误判的嫌疑人持关键真相
      爱情: 被低估的暗恋者持不可替代的情感史
      玄幻: 废柴体制内持禁忌血脉
      科幻: 被系统标记为冗余者持异常权限
      职场: 背锅小吏持跨界方法论
      校园: 差生持成人经验(重生/早慧)
    originality_risk: LOW
    video_potential: 8

  - id: MM02
    mechanism: Assert-Then-Invert Delayed Payoff (断言加息 + 反转延迟兑现)
    appears_in: [IEWU, FW, LiC, TML, HM, CAL, WC, EGN, DCS]  # GLOBAL 5/5 + 跨组
    underlying_psychology: "先把'所有人都不信'的断言前置(太弱/不可能会/有前科), 兑现时利息=断言强度×延迟时长——期待的字面价值工程"
    minimum_components: [一个公开的不可能断言, 读者见证断言者的困境, 兑现时刻的旁观者反应镜头]
    optional_components: [断言者的自我怀疑(利息加息), 多次小额兑现维持信用]
    failure_modes: ["断言无人见证→兑现无利息", "延迟过长无中间兑付→读者弃书", "兑现靠外力(巧合)→利息清零"]
    transformations:
      都市: 债务/阶层断言
      悬疑: "No one will believe you 式孤证"
      爱情: 被断言不配的爱
      玄幻: 被断言废掉的资质
      科幻: 被断言不可能的实验
      职场: 被断言必死的项目
      校园: 被断言考不上的学校
    originality_risk: LOW
    video_potential: 9

  - id: MM03
    mechanism: Manifesto-Title Contract (宣言式标题契约)
    appears_in: [DCS, TML, CAL]
    underlying_psychology: "书名/第一句=主角公开宣言, 正文=宣言的持续测试与反讽——标题预装全书期待结构, 且免费获得传播记忆点"
    minimum_components: [宣言式命题(可转述为一句口号), 正文对宣言的持续压力]
    optional_components: [宣言最终被打破或被改写(两种兑付方向)]
    failure_modes: ["宣言无张力(无人反对)→合同作废", "反讽过早揭穿→后程无戏"]
    transformations:
      都市: 生活方式宣言
      悬疑: "我发誓我没杀她式自辩标题"
      爱情: 反恋爱宣言
      玄幻: 反杀伐宣言
      科幻: 反技术宣言
      职场: 躺平宣言
      校园: 差生逆袭宣言
    originality_risk: LOW  # 但 DCS 的具体句式("都X了谁X啊")已被模仿至失效边缘——只用原理, 不用句式
    video_potential: 8

  - id: MM04
    mechanism: Double-Ignorance Opening (双重无知开局)
    appears_in: [SRI, TML(遗憾无知+图书馆无知)]
    underlying_psychology: "同时剥夺主角的世界知识与自我知识——每一次获取都是双倍奖励; 身份底牌可在生存压力下无限延期兑付"
    minimum_components: [世界规则未知, 主角身份/过去未知]
    optional_components: [两条求知线的交叉点(身份即世界真相)]
    failure_modes: ["长期无知识增量→无知变空洞", "身份揭晓与期待脱钩"]
    transformations:
      都市: 失忆归来者
      悬疑: 本格侦探自带谜(双重谜题)
      爱情: 不知自己是谁的人被爱
      玄幻: 无名之辈+封印记忆
      科幻: 冷冻苏醒者的时代+自我双重错位
      职场: 空降者不懂公司也不懂自己为何被雇
      校园: 转学生的双重空白
    originality_risk: LOW
    video_potential: 7

  # ============ B. 长篇续航结构类 ============

  - id: MM05
    mechanism: Dual-Timetable Architecture (单元容器 + 长线底牌双时间表)
    appears_in: [DF, ZS, SRI, CYS, DCS, CAL(环节容器+官场底牌), TML(平行世界容器+自我真相)]
    underlying_psychology: "可无限更换的单元容器供血高频奖励; 全书级底牌维持长线张力——长篇可持续性的核心架构, 网文的工业化形态"
    minimum_components: [标准化单元容器(案件/游戏/试穿/项目), 容器间不变的主角引擎, 全书级底牌/真相线]
    optional_components: [容器与底牌的层级绑定(破案即开图), 底牌兑付的分级拆分]
    failure_modes: ["容器同质化(换皮不换玩法)", "底牌兑付过早", "容器线与底牌线长期无交叉→双线脱节"]
    transformations:
      都市: 商机/委托制
      悬疑: 案件制
      爱情: 对象/关系阶段制
      玄幻: 副本/秘境制
      科幻: 任务/远征制
      职场: 项目制(TML/CAL 证明文学叙事同样适用)
      校园: 学期/竞赛制
    originality_risk: LOW
    video_potential: 9

  - id: MM06
    mechanism: Checklist-as-Structure (清单即结构)
    appears_in: [CYS(遗憾), DCS(风口), ZS(神话), DF(案件排期), RSH(证人), TML(遗憾之书)]  # 15 本第二强公约数
    underlying_psychology: "可枚举清单同时充当三件事: 章节地图 / 体量规划文档 / 读者期待管理器——清单完成度即免费进度条"
    minimum_components: [一份内容上成立的枚举清单(读者认账的枚举逻辑)]
    optional_components: [清单项的时代/层级排序, 清单项间耦合(勾掉一项牵动其余)]
    failure_modes: ["清单项质量方差大", "清单过早耗尽→续作崩塌", "清单为凑数而清单(枚举逻辑不成立)"]
    transformations:
      都市: 目标/愿清单
      悬疑: 嫌疑人/证人清单
      爱情: 约会清单/理想对象条件单
      玄幻: 收集/试炼清单
      科幻: 补给/探索点清单
      职场: OKR/项目里程碑
      校园: 考试/申请清单
    originality_risk: LOW
    video_potential: 7

  - id: MM07
    mechanism: Time-as-Container Structure (时间容器结构)
    appears_in: [EGN(一日百年), FH(双时代回声), RSH(证人60年接力), WC(一生一诺)]
    underlying_psychology: "纯文学对悬念结构的替代: 用时间形态(一日/双时代/接力/一生)作结构容器——跨度本身即史诗感来源, 读者为'时间将如何收束'翻页"
    minimum_components: [一个非线性的时间形态设计, 时间容器内的不变量(人物/物件/诺言)]
    optional_components: [双时代回声(同一物件/地点跨时代对位)]
    failure_modes: ["时间形态无内容必要性(为结构而结构)", "不变量丢失→容器散架"]
    transformations:
      都市: 一夜城市/十年之约
      悬疑: 跨代悬案的时间接力
      爱情: 双时空对照爱情
      玄幻: 转世时间容器
      科幻: 相对论时间差(星际穿越式)
      职场: 行业兴衰三十年
      校园: 毕业十年的重聚
    originality_risk: LOW
    video_potential: 7

  - id: MM08
    mechanism: Meta-Container Grammar Rotation (容器换语法不换皮)
    appears_in: [SRI(每轮游戏换叙事语法), TML(每个平行世界换人生类型)]
    underlying_psychology: "单元容器的最高抗疲劳等级: 每轮更换的不止是题材皮, 而是叙事语法(推理/合作/背叛/心理战)——读者每次都是新游戏"
    minimum_components: [单元容器, 每轮容器的规则层差异(玩法级而非题材级)]
    optional_components: [语法轮换表(预排各轮类型), 跨轮累积的元规则]
    failure_modes: ["语法轮换无预告→读者类型期待错位", "轮换节奏过密→无积累感"]
    transformations:
      都市: 每个商战单元换博弈类型
      悬疑: 每案换推理流派(本格/社会/倒叙)
      爱情: 每段关系换爱情范式
      玄幻: 每副本换规则体系
      科幻: 每任务换科幻子类型
      职场: 每项目换职场困境类型
      校园: 每学期换成长议题
    originality_risk: LOW
    video_potential: 8

  - id: MM09
    mechanism: Transition-Machine Narration (转场机器叙事)
    appears_in: [FH(饭局八卦), RSH(证人证言), WC(补叙重估), LiC(场景切换的章节间)]
    underlying_psychology: "文学长篇不靠章末钩靠'转场装置'维持翻页: 饭局/证言/补叙——每次转场自带信息重组与视角税, 转场本身成为消费对象"
    minimum_components: [一个可反复启用的叙事转场装置(场合/声部/文体)]
    optional_components: [转场装置的磨损与升级(证言开始互相矛盾)]
    failure_modes: ["转场装置信息含量衰减→读者识破为凑结构", "装置使用频率与信息密度不匹配"]
    transformations:
      都市: 酒局/群聊/播客转场
      悬疑: 笔录/庭审/访谈转场
      爱情: 闺蜜复盘/日记转场
      玄幻: 说书人/庙会讲述转场
      科幻: AI 档案/通讯记录转场
      职场: 会议纪要/复盘会转场
      校园: 流言/校园论坛转场
    originality_risk: LOW  # FH 的吴语对白资产除外
    video_potential: 7

  - id: MM10
    mechanism: Impossible-Task Decomposition + Deadline (不可能任务分解 + 死线)
    appears_in: [CAL(荔枝转运), FW(致死日程), SRI(死亡游戏排期)]
    underlying_psychology: "把一个不可能目标工程化分解为可见环节链, 再加死线倒计时——读者的进度感知被环节完成度接管, 悬念从'能否'变为'哪个环节先断'"
    minimum_components: [不可能目标, 环节链分解(读者可见), 硬死线]
    optional_components: [每个环节的专属反派/资源瓶颈, 环节间的连锁风险(一环断全链断)]
    failure_modes: ["环节无真实阻力→分解变流水账", "死线无牙齿(无代价)→倒计时失效"]
    transformations:
      都市: 筹款/移民/维权倒计时
      悬疑: 侦探自身的破案死线
      爱情: 婚礼前/出国前的情感死线
      玄幻: 大赛前/寿元尽的修炼死线
      科幻: 灾难倒计时任务链
      职场: 交付死线(最强原位, CAL 已验证出圈)
      校园: 高考/比赛倒计时
    originality_risk: LOW
    video_potential: 8

  # ============ C. 奖励与欲望类 ============

  - id: MM11
    mechanism: Dual-Layer Desire Structure (双层欲望结构)
    appears_in: [IEWU, FW, LiC, TML, HM]  # GLOBAL 5/5; CAL/DCS 部分命中
    underlying_psychology: "表层爽感负责翻页, 深层补偿负责口碑——'这本书改变了我'式推荐语只能由深层产生; 商业与口碑的双引擎分工"
    minimum_components: [表层欲望(可即时兑付), 深层欲望(全书级兑付), 两层的张力(追表层常阻碍深层)]
    optional_components: [深层的伪装(以表层面目出现, 如'事业'实为'被承认')]
    failure_modes: ["只有表层→快餐无口碑", "只有深层→无翻页动力", "两层无张力关系→并行不共振"]
    transformations:
      都市: 搞钱表层×尊严深层
      悬疑: 破案表层×救赎深层
      爱情: 得到TA表层×自我完整深层
      玄幻: 变强表层×归属深层
      科幻: 探索表层×人的定义深层
      职场: 晋升表层×价值证明深层
      校园: 分数表层×身份认同深层
    originality_risk: LOW
    video_potential: 6

  - id: MM12
    mechanism: Reward-Economics Selection (五型奖励经济学选型)
    appears_in: "全部 15 本 (作为选型系统而非单一机制)"
    underlying_psychology: "奖励曲线决定读者关系: 纯增型训练期待, 递减型驯化阈值, 反转型制造清醒, 补偿型平衡痛感, 悬置型蓄爆结局——选错光谱比执行差更致命"
    five_types:
      纯增型: {appears_in: [FW, DF, ZS], 适合: 长篇连载/升级流, 风险: "爽点通胀"}
      递减型: {appears_in: [TML], 适合: 寓言/治愈, 风险: "读者提前识破循环"}
      反转型: {appears_in: [IEWU], 适合: 主题文学/女性向, 风险: "两头得罪——需主题深度兜底"}
      补偿型: {appears_in: [LiC, EGN], 适合: 时代文学/悲剧美学, 风险: "补偿过迟→弃书"}
      悬置型: {appears_in: [HM], 适合: 惊悚/短篇, 风险: "结局承担全部债务"}
    minimum_components: [明确的主奖励类型选型 + 全书奖励曲线的一致性]
    originality_risk: LOW
    video_potential: 7

  - id: MM13
    mechanism: Pre-Revealed Payoff (预告式兑付)
    appears_in: [CAL('一骑红尘妃子笑'结局前置), EGN(萨满跳神=预告的悲剧), TML(遗憾清单)]
    underlying_psychology: "提前告知终点(读者知道荔枝会到/悲剧会发生), 悬念转移到'代价与路径'——宿命感把期待改写为美学, 读者为'如何抵达'而非'是否抵达'翻页"
    minimum_components: [终点的提前披露, 代价/路径的不可见性]
    optional_components: [终点的多重读法(到=失去), 预告者的立场暧昧]
    failure_modes: ["终点无宿命感→剧透感", "路径无意外→兑现变走流程"]
    transformations:
      都市: 逆袭结局前置, 过程为谜
      悬疑: 开场即尸体(倒叙推理)
      爱情: 已知结局的老年回望
      玄幻: 预言体系
      科幻: 时间旅行者已知未来
      职场: 项目成败已知, 人事为谜
      校园: 名校录取通知书开场
    originality_risk: LOW
    video_potential: 7

  - id: MM14
    mechanism: Conservation-Law Power System (守恒律力量系统)
    appears_in: [EGN(跳神救一人损一亲), CAL(转运成功=道德亏空), SRI(纯智力=零外挂)]
    underlying_psychology: "一切力量明码标价——能力越强代价越即时; 守恒律把爽点自动转化为悲剧发生器, 是文学版与网文版共同的'金手指正当化'法则"
    minimum_components: [力量使用规则, 可感知的即时代价, 代价与主角所爱的关联]
    optional_components: [代价的记账可视化(账本), 代价的延迟爆发]
    failure_modes: ["代价可被绕过→守恒破产", "代价无情感关联→玩家式麻木"]
    transformations:
      都市: 财富/健康/关系的守恒交换
      悬疑: 每个推理突破牺牲一条关系
      爱情: 讨好换来的爱必以自我折损计价
      玄幻: 禁术血偿(最原位)
      科幻: 技术奇点的社会代价
      职场: 晋升的家庭成本
      校园: 成绩的青春交换
    originality_risk: LOW
    video_potential: 7

  - id: MM15
    mechanism: Experience-Sampling Reward (人生试穿型奖励)
    appears_in: [TML(平行人生), DCS/CYS(重生=前世经验作资产)]
    underlying_psychology: "一次付费玩遍人生——体验型 reward 全家桶; 平行世界/重生结构让读者在单部作品内消费多种人生模板"
    minimum_components: [可进入/可退出的体验容器, 体验间的对比结构(试穿后重估)]
    optional_components: [体验的累积改变选择者本身, 最后一次试穿=真实选择]
    failure_modes: ["试穿样本无梯度差异", "主角不消化体验→白穿"]
    transformations:
      都市: 假设人生模拟
      悬疑: 进入他人记忆查案
      爱情: 与不同对象的可能人生
